name: Testes web
on: [pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test scripts/*.test.mjs
      # PostgreSQL nativo do runner (cluster temporário via initdb/pg_ctl; sem services: nem container:)
      - run: bash scripts/pg-test.sh
